<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Seguimiento Solar & Rentabilidad</title>
    <script>
      // Redirección inteligente para GitHub Pages SPA
      (function() {
        var path = window.location.pathname;
        // Si el navegador viene con /docs/ por el bug anterior, corregir a la raíz
        if (path.includes('/docs/')) {
          var cleanPath = path.replace(/\/docs(\/.*)?$/, '/');
          window.location.replace(cleanPath);
          return;
        }
        // En GitHub Pages, redirigir a la base del repositorio
        if (window.location.hostname.includes('github.io')) {
          var segments = path.split('/').filter(Boolean);
          if (segments.length > 0) {
            window.location.replace('/' + segments[0] + '/');
            return;
          }
        }
        window.location.replace('./');
      })();
    </script>
  </head>
  <body style="background-color: #0c130d; color: #ecf5ea; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Cargando aplicación...</p>
  </body>
</html>
